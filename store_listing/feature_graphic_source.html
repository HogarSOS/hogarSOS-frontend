<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1024px;
    height: 500px;
    overflow: hidden;
    font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
  }

  .banner {
    position: relative;
    width: 1024px;
    height: 500px;
    background: linear-gradient(135deg, #1E8A5A 0%, #146B45 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Silueta de casa gigante y muy tenue de fondo, a la derecha — textura
     de marca sutil, sin competir con el lockup principal. */
  .watermark {
    position: absolute;
    right: -90px;
    top: -60px;
    width: 620px;
    height: 620px;
    opacity: 0.07;
  }

  .contenido {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }

  .lockup {
    display: flex;
    align-items: center;
    gap: 28px;
  }

  .marca {
    width: 132px;
    height: 132px;
  }

  .wordmark {
    font-weight: 800;
    font-size: 92px;
    letter-spacing: -2px;
    color: #FFFFFF;
    line-height: 1;
  }
  .wordmark .sos { color: #FF8A6E; }

  .tagline {
    font-weight: 500;
    font-size: 28px;
    letter-spacing: 0.2px;
    color: rgba(255,255,255,0.92);
  }
</style>
</head>
<body>
  <div class="banner">
    <svg class="watermark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <g fill="#FFFFFF">
        <path d="M56.84,27.3 L75.21,46.89 Q80,52 73,52 L27,52 Q20,52 24.79,46.89 L43.16,27.3 Q50,20 56.84,27.3 Z"/>
        <path d="M30,52 L70,52 L70,74 A6,6 0 0 1 64,80 L36,80 A6,6 0 0 1 30,74 Z"/>
      </g>
    </svg>

    <div class="contenido">
      <div class="lockup">
        <svg class="marca" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <g fill="#FFFFFF">
            <path d="M56.84,27.3 L75.21,46.89 Q80,52 73,52 L27,52 Q20,52 24.79,46.89 L43.16,27.3 Q50,20 56.84,27.3 Z"/>
            <path d="M30,52 L70,52 L70,74 A6,6 0 0 1 64,80 L36,80 A6,6 0 0 1 30,74 Z"/>
          </g>
          <circle cx="74" cy="28" r="7" fill="#FF6A4D"/>
        </svg>
        <div class="wordmark">hogar<span class="sos">SOS</span></div>
      </div>
      <div class="tagline">Profesionales de confianza para tu hogar</div>
    </div>
  </div>
</body>
</html>
