name: hogarsos
description: App marketplace de servicios a domicilio - hogarSOS
publish_to: "none"
version: 0.1.1+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.6.0
  firebase_messaging: ^15.2.0
  # Muestra la notificación cuando llega con la app en primer plano —
  # FCM/Android no la enseña solo en ese caso (sí lo hace en segundo
  # plano/app cerrada, vía el canal por defecto). Sin esto el mensaje
  # solo quedaba en un debugPrint, invisible para quien probaba con la
  # app abierta.
  flutter_local_notifications: ^17.2.3

  # Estado
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3+1

  # Almacenamiento seguro de tokens
  flutter_secure_storage: ^9.2.2

  # Mapas y geolocalización
  google_maps_flutter: ^2.6.1
  geolocator: ^12.0.0

  # Selección de fotos (paso opcional del asistente de solicitud)
  image_picker: ^1.1.2

  # Pagos
  flutter_stripe: ^13.1.0

  # Abrir el onboarding hospedado de Stripe Connect en el navegador
  url_launcher: ^6.3.1

  # UI y utilidades
  cupertino_icons: ^1.0.6
  intl: ^0.20.2
  cached_network_image: ^3.3.1

  # Tipografía de marca (Sprint 1 — identidad visual)
  google_fonts: ^6.2.1
  app_links: ^7.2.1

  # Badge numérico en el icono de la app (UX#6) — no hace nada (sin
  # excepción) en launchers Android que no lo soportan, ver
  # app_badge_service.dart.
  app_badge_plus: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
