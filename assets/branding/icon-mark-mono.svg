<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>hogarSOS — icono de marca (una tinta)</title>
  <!-- Una sola tinta, sin fondo — para estampados, membretes o
       cualquier superficie de color donde el degradado de marca no
       aplique. Sustituir currentColor por la tinta deseada al usarlo. -->
  <g fill="currentColor">
    <path d="M34,50 L66,50 L66,71 A3,3 0 0 1 63,74 L37,74 A3,3 0 0 1 34,71 Z"/>
    <circle cx="50" cy="50" r="16"/>
    <circle cx="74" cy="28" r="7.5"/>
  </g>
</svg>
