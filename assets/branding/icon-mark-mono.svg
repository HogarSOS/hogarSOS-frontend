<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Hogar SOS — icono de marca (una tinta)</title>
  <!-- Una sola tinta, sin fondo — para estampados, membretes o
       cualquier superficie de color donde el degradado de marca no
       aplique. Sustituir currentColor por la tinta deseada al usarlo. -->
  <g fill="currentColor">
    <path d="M56.84,27.3 L75.21,46.89 Q80,52 73,52 L27,52 Q20,52 24.79,46.89 L43.16,27.3 Q50,20 56.84,27.3 Z"/>
    <path d="M30,52 L70,52 L70,74 A6,6 0 0 1 64,80 L36,80 A6,6 0 0 1 30,74 Z"/>
    <circle cx="74" cy="28" r="7"/>
  </g>
</svg>
